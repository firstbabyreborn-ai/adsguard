# fly launch --no-deploy, then attach a Postgres (fly postgres create / attach)
app = "adsguard"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  STORAGE_DRIVER = "pg"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[mounts]
# not needed with Postgres; kept as documentation of the alternative
# source = "adsguard_data"
# destination = "/data"
