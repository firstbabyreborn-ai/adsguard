# Render Blueprint — $0, no credit card.
# New + Blueprint -> pick this repo -> Apply. Render prompts for the three
# secret values, creates the database, and connects it automatically.
#
# APP_URL is NOT required: Render injects RENDER_EXTERNAL_URL at runtime and
# the app falls back to it. If you later add a custom domain, set APP_URL.
services:
  - type: web
    name: adsguard
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: pg
      - key: SCHEDULER_ENABLED
        value: 'true'
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adsguard-db
          property: connectionString

databases:
  - name: adsguard-db
    plan: free
    region: singapore
